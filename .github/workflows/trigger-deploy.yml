name: Trigger.dev Deploy

# Pushes task code under `server/trigger/` to Trigger.dev's prod environment
# on every push to main. A path filter was tried but caused a bootstrap miss
# (the PR that added this workflow didn't touch the filtered paths, so the
# initial deploy never fired). Trigger deploys are cheap (~1-2 min) and
# idempotent — re-running on a no-op commit is fine.
#
# Auth: `TRIGGER_ACCESS_TOKEN` (a Personal Access Token, `tr_pat_***`).
# Generate at https://cloud.trigger.dev/account/tokens and store as a repo
# Actions secret. This is distinct from `TRIGGER_SECRET_KEY` (runtime auth
# the deployed Fastify uses to dispatch tasks).
#
# Target project ref is read from `trigger.config.ts` at the repo root — the
# CLI doesn't take it via env. PAT scopes to the user's projects.

"on":
  push:
    branches: [main]
  # Manual fire from the Actions tab (e.g. after a PAT rotation).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy tasks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Trigger.dev (prod)
        run: pnpm exec trigger deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
