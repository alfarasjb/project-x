# Local Postgres for development.
#   docker compose up -d        → start
#   docker compose down         → stop (data persists in the named volume)
#   docker compose down -v      → stop and wipe data
#
# Credentials match .env.example:
#   DATABASE_URL=postgres://user:password@localhost:5544/projectx
#
# Host port is 5544 (not the default 5432) to avoid clashing with any other
# local Postgres. The container still listens on 5432 internally.

services:
  postgres:
    # `pgvector/pgvector:pg18` is the upstream Postgres 18 image with the
    # `vector` extension preinstalled — drop-in replacement for `postgres:18`
    # since the data layout matches. Required for the node-embeddings table
    # (HNSW indexes over voyage-code-3 embeddings). No volume wipe needed
    # when migrating from `postgres:18-alpine`; just `CREATE EXTENSION vector`
    # in the first migration that uses it.
    image: pgvector/pgvector:pg18
    container_name: projectx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: projectx
    ports:
      - "5544:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory and expects the
      # mount at /var/lib/postgresql (NOT /var/lib/postgresql/data — the pre-18
      # path, which the 18 image rejects).
      - projectx-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d projectx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  projectx-pgdata:
