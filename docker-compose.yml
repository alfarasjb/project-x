# Local Postgres for development.
#   docker compose up -d        → start
#   docker compose down         → stop (data persists in the named volume)
#   docker compose down -v      → stop and wipe data
#
# Credentials match .env.example:
#   DATABASE_URL=postgres://user:password@localhost:5432/projectx

services:
  postgres:
    image: postgres:18-alpine
    container_name: projectx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: projectx
    ports:
      - "5432:5432"
    volumes:
      - projectx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d projectx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  projectx-pgdata:
